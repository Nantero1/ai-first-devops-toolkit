---
name: $(Build.Reason)-$(BuildID)

# Prevent multiple parallel runs with batch
trigger:
  batch: true
  branches:
    include:
      - main

# For pull request validation builds
pr:
  branches:
    include:
      - main

# Add explicit lock behavior to run only the latest pipeline
lockBehavior: runLatest

resources:
  repositories:
    - repository: Templates
      type: git
      name: CDOS/azure-devops-pipeline
      ref: feat/python_make_requirement_optional
  pipelines:
    - pipeline: base-image-miniconda-4.11-rhel8
      source: base-image-miniconda-4.11-rhel8
      trigger:
        branches:
          include:
            - main

pool: $(AGENT_POOL)

extends:
  template: pipeline.yml@Templates
  parameters:
    techId: marketplace
    securityZone: dev
    variables:
      - group: vg-base-images
    teamsChannel: '7272056f.teambank.de@de.teams.ms'
    notifyOnSuccess: false

    stages:
      - stage: test
        displayName: Test & Quality
        jobs:
          - template: Jobs/python_tests.yml@Templates
            parameters:
              requirementFiles: ""
              pythonBinary: "UV_NO_SYNC=0 uv run --group dev --frozen python"
              # TODO: set to true, after solving DOTNET issue
              codeCoverage: false
              container:
                image: cdos-marketplace-docker/llm-runtime:latest
                endpoint: "sc-generic-docker"
              
          # TODO:
          # - template: Jobs/sonarqube_cli_generic.yml@Templates
          #   parameters:
          #     sonarQube: 'sc-cdos-sonar'
          #     dependsOn:
          #       - run_python_tests
          #     cliProjectKey: 'CDOS_marketplace-llm-runtime_345475696jfg'
          #     extraProperties: |
          #       sonar.language=python
          #       sonar.python.coverage.reportPaths=coverage.xml
          #       sonar.python.xunit.reportPaths=test-results.xml
          #       sonar.python.version=3.12
          #     coverageXmlArtifact: "coverage.xml"
          #     cliSources: './'
          #     testResultsArtifact: "TestResults"

      - stage: build
        displayName: Build
        dependsOn:
          - test
        condition: succeeded()
        jobs:
          - template: Jobs/docker.yml@Templates
            parameters:
              imageName: llm-runtime
               # ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
              latestTag: true
              dgoss: true
              xrayScan: true
              xrayFailBuild: false
              buildArch:
                - linux/amd64
#                - linux/arm64
              secretArgs:
                ARTIFACTORY_USR: cdos-write
                ARTIFACTORY_PSW: $(ARTIFACTORY-DELIVERY-TOKEN)
              ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
                publish: false
              artifacts:
                - path: github-proxy/mikefarah/yq/releases/latest/download/yq_linux_amd64
                  target: yq_amd64
                - path: github-proxy/mikefarah/yq/releases/latest/download/yq_linux_arm64
                  target: yq_arm64
